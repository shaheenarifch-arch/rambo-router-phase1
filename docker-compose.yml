services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rambo
      POSTGRES_PASSWORD: rambo
      POSTGRES_DB: rambo
    ports: ["5432:5432"]
    volumes: ["rambo_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rambo"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    env_file: .env
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  rambo_pg:
